<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dodge!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0f1020; color: #fff; font-family: monospace; overflow: hidden; touch-action: none; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  canvas { background: linear-gradient(#1b1d3a, #2a1f4a); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); max-width: 100vw; max-height: 100vh; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="720"></canvas></div>
<script>
// ===== Setup =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// On touch screens (phones/tablets), add a tall strip of grass below the duck
// so your thumb has room to drag without covering the play area.
const TOUCH = matchMedia('(pointer: coarse)').matches;
if (TOUCH) canvas.height = 800;
const W = canvas.width, H = canvas.height;
const GROUND = TOUCH ? H - 120 : H - 40;

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H, 1.2);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
window.addEventListener('resize', fit); fit();

// ===== Pixel art =====
// Each sprite is a grid of letters; each letter maps to a color ('.' = empty).
const PALETTE = {
  Y: '#ffd93b', W: '#e0b31c', K: '#1a1a1a', O: '#ff8c1a',            // duck
  B: '#3b6bdc', k: '#11152e',                                         // bowling ball
  Q: '#7a5230', C: '#c99a5b',                                         // crate
  A: '#5a3825', a: '#7a4e33', w: '#f2f2f2',                           // piano
  R: '#e63946', r: '#a3202c', f: '#9a9a9a', F: '#ffcf3b',             // tnt
  g: '#4caf50', c: '#f5e6c8',                                         // chili / mushroom
  p: '#ff8fc7', s: '#4ee1c1', d: '#d9a066',                           // donut
  i: '#7fd8ff', I: '#d6f3ff', L: '#8b5a2b',                           // popsicle
  y: '#f7c531', u: '#ffe27a'                                          // corn
};
const SPRITES = {
  duck1: [
    "....YYYY....",
    "...YYYYYY...",
    "...YYYKYYOO.",
    "...YYYYYYOOO",
    "....YYYYY...",
    ".....YYY....",
    "YY..YYYYYY..",
    "YYYYYYYYYYY.",
    "YYYYYWWYYYY.",
    ".YYYYWWWYYY.",
    "..YYYYYYYY..",
    "...O....O...",
    "..OO...OO..."
  ],
  duck2: [
    "....YYYY....",
    "...YYYYYY...",
    "...YYYKYYOO.",
    "...YYYYYYOOO",
    "....YYYYY...",
    ".....YYY....",
    "YY..YYYYYY..",
    "YYYYYYYYYYY.",
    "YYYYYWWYYYY.",
    ".YYYYWWWYYY.",
    "..YYYYYYYY..",
    "....O..O....",
    "...OO.OO...."
  ],
  // --- Hazards ---
  bowlingBall: [
    "..BBBB..",
    ".BBBBBB.",
    "BBBkBkBB",
    "BBBBBBBB",
    "BBBBkBBB",
    "BBBBBBBB",
    ".BBBBBB.",
    "..BBBB.."
  ],
  crate: [
    "QQQQQQQQQQ",
    "QQCCCCCCQQ",
    "QCQCCCCQCQ",
    "QCCQCCQCCQ",
    "QCCCQQCCCQ",
    "QCCCQQCCCQ",
    "QCCQCCQCCQ",
    "QCQCCCCQCQ",
    "QQCCCCCCQQ",
    "QQQQQQQQQQ"
  ],
  piano: [
    "aaaaaaaaaaaaaa",
    "AAAAAAAAAAAAAA",
    "AAAAAAAAAAAAAA",
    "AwkwkwwkwkwkwA",
    "AwkwkwwkwkwkwA",
    "AwwwwwwwwwwwwA",
    "AAAAAAAAAAAAAA",
    "AAAAAAAAAAAAAA",
    "AA..........AA",
    "AA..........AA",
    "aa..........aa"
  ],
  tnt: [
    ".....F.....",
    ".....f.....",
    "....f......",
    "RRRrRRRrRRR",
    "RRRrRRRrRRR",
    "wkkkkkkkkkw",
    "wwkwkwkwkww",
    "wwkwkwkwkww",
    "RRRrRRRrRRR",
    "RRRrRRRrRRR",
    "RRRrRRRrRRR"
  ],
  // --- Food power-ups ---
  chili: [
    "......g.",
    ".....g..",
    "....RRR.",
    "...RRRR.",
    "..RRRR..",
    ".RRRR...",
    "RRRR....",
    "RR......"
  ],
  mushroom: [
    "..RRRR..",
    ".RRwRRR.",
    "RwRRRwRR",
    "RRRRRRRR",
    "..cccc..",
    "..cccc..",
    "..cccc.."
  ],
  donut: [
    "..pppp..",
    ".pspppp.",
    "ppsppspp",
    "ppp..ppp",
    "ddd..ddd",
    "dddddddd",
    ".dddddd.",
    "..dddd.."
  ],
  popsicle: [
    ".iiiii.",
    "iiiiiii",
    "iIiiiii",
    "iIiiiii",
    "iiiiiii",
    "iiiiiii",
    ".iiiii.",
    "...L...",
    "...L..."
  ],
  corn: [
    "..uyu..",
    ".yuyuy.",
    ".uyuyu.",
    ".yuyuy.",
    ".uyuyu.",
    "gyuyuyg",
    "ggyuygg",
    ".ggggg."
  ]
};

// Which hazards fall, and how often (higher weight = more common)
const HAZARDS = [
  { name: 'bowlingBall', weight: 4, px: [4, 5] },
  { name: 'crate',       weight: 4, px: [4, 5] },
  { name: 'tnt',         weight: 2, px: [3, 4] },
  { name: 'piano',       weight: 1, px: [5, 6] }
];

// Food power-ups: what each one does
const FOODS = {
  chili:    { label: 'SPEED!',     desc: 'Hot pepper: super speed', dur: 6,  color: '#ff6b4a' },
  mushroom: { label: 'TINY!',      desc: 'Mushroom: tiny duck',     dur: 6,  color: '#ff8fc7' },
  donut:    { label: 'SHIELD!',    desc: 'Donut: blocks one hit',   dur: 0,  color: '#4ee1c1' },
  popsicle: { label: 'SLOW-MO!',   desc: 'Popsicle: slows time',    dur: 5,  color: '#7fd8ff' },
  corn:     { label: '2X POINTS!', desc: 'Golden corn: 2x points',  dur: 8,  color: '#ffd93b' }
};
const FOOD_NAMES = Object.keys(FOODS);

// Pre-render each sprite once at a given pixel size, so drawing is fast.
const cache = {};
function sprite(name, px) {
  const key = name + px;
  if (cache[key]) return cache[key];
  const rows = SPRITES[name];
  const c = document.createElement('canvas');
  c.width = rows[0].length * px; c.height = rows.length * px;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    g.fillStyle = PALETTE[ch];
    g.fillRect(x * px, y * px, px, px);
  }));
  return cache[key] = c;
}

// ===== Game state =====
let state = 'menu';
let duck, things, foods, particles, blasts, popups, power;
let score, best = 0, spawnTimer, foodTimer, speedUp, lastTime, walkTime = 0, shake = 0;

function reset() {
  duck = { x: W / 2, facing: 1, moving: false, invuln: 0 };
  things = []; foods = []; particles = []; blasts = []; popups = [];
  power = { chili: 0, mushroom: 0, popsicle: 0, corn: 0, shield: false };
  score = 0; spawnTimer = 0; foodTimer = 3; speedUp = 1; shake = 0;
}

// Duck size depends on the mushroom power-up
const duckPx = () => power.mushroom > 0 ? 2 : 4;
const duckR  = () => power.mushroom > 0 ? 10 : 20;
const duckY  = () => GROUND - sprite('duck1', duckPx()).height / 2;

// ===== Input =====
const keys = {};
let pointerX = null;
addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'playing') start();
});
addEventListener('keyup', e => keys[e.key] = false);
function toCanvasX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (W / rect.width);
}
canvas.addEventListener('pointerdown', e => { if (state !== 'playing') start(); pointerX = toCanvasX(e.clientX); });
canvas.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') pointerX = toCanvasX(e.clientX); });
canvas.addEventListener('pointerup', () => pointerX = null);
function start() { reset(); state = 'playing'; }

// ===== Spawning =====
function pickHazard() {
  const total = HAZARDS.reduce((s, h) => s + h.weight, 0);
  let n = Math.random() * total;
  for (const h of HAZARDS) { if ((n -= h.weight) < 0) return h; }
  return HAZARDS[0];
}
function spawnThing() {
  const h = pickHazard();
  const px = h.px[0] + Math.floor(Math.random() * (h.px[1] - h.px[0] + 1));
  const img = sprite(h.name, px);
  things.push({
    type: h.name, img, w: img.width, h: img.height,
    x: img.width / 2 + Math.random() * (W - img.width),
    y: -img.height,
    vy: (h.name === 'piano' ? 260 : 160 + Math.random() * 140) * speedUp,
    wob: Math.random() * 6, ws: 3 + Math.random() * 3,
    landed: false, fuse: 0
  });
}
function spawnFood() {
  const name = FOOD_NAMES[Math.floor(Math.random() * FOOD_NAMES.length)];
  const img = sprite(name, 4);
  foods.push({ name, img, x: 30 + Math.random() * (W - 60), y: -30, r: 16, vy: 150, bob: Math.random() * 6 });
}

// ===== Effects =====
function burst(x, y, colors, count, speed, size) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, v = speed * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.3,
      life: 0.5 + Math.random() * 0.5, color: colors[i % colors.length], size });
  }
}
function popup(text, x, y, color) { popups.push({ text, x, y, color, life: 1.2 }); }

function explode(t) {
  const radius = 70 + t.w * 0.6;
  blasts.push({ x: t.x, y: t.y, r: radius, life: 0.4 });
  burst(t.x, t.y, ['#ffcf3b', '#ff8c1a', '#e63946', '#fff'], 40, 320, 6);
  shake = 0.35;
  if (Math.hypot(t.x - duck.x, t.y - duckY()) < radius + duckR() * 0.5) hurt();
}

function hurt() {
  if (duck.invuln > 0) return;
  if (power.shield) {
    power.shield = false;
    duck.invuln = 1.2;
    popup('SHIELD SAVED YOU!', duck.x, duckY() - 50, '#4ee1c1');
    burst(duck.x, duckY(), ['#4ee1c1', '#fff'], 20, 200, 4);
    return;
  }
  state = 'over';
  best = Math.max(best, Math.floor(score));
  burst(duck.x, duckY(), ['#ffd93b', '#fff'], 25, 250, 4);
}

// Circle (duck) vs. rectangle (falling object) collision
function hitsDuck(t) {
  const cx = duck.x, cy = duckY(), r = duckR() * 0.85;
  const hw = t.w * 0.42, hh = t.h * 0.42;
  const nx = Math.max(t.x - hw, Math.min(cx, t.x + hw));
  const ny = Math.max(t.y - hh, Math.min(cy, t.y + hh));
  return Math.hypot(cx - nx, cy - ny) < r;
}

// ===== Update =====
function update(dt) {
  // Particles and popups keep animating even after game over
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const b of blasts) b.life -= dt;
  blasts = blasts.filter(b => b.life > 0);
  for (const p of popups) { p.y -= 40 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);

  if (state !== 'playing') return;

  // Power-up timers
  for (const k of ['chili', 'mushroom', 'popsicle', 'corn']) power[k] = Math.max(0, power[k] - dt);
  duck.invuln = Math.max(0, duck.invuln - dt);
  const worldDt = power.popsicle > 0 ? dt * 0.45 : dt;   // slow-mo affects falling things only

  // Move duck
  let dx = 0;
  if (keys['ArrowLeft'] || keys['a']) dx -= 1;
  if (keys['ArrowRight'] || keys['d']) dx += 1;
  if (pointerX !== null) {
    const diff = pointerX - duck.x;
    dx = Math.abs(diff) < 4 ? 0 : Math.sign(diff) * Math.min(1, Math.abs(diff) / 40);
  }
  const speed = power.chili > 0 ? 650 : 380;
  duck.x += dx * speed * dt;
  duck.x = Math.max(duckR() + 4, Math.min(W - duckR() - 4, duck.x));
  duck.moving = dx !== 0;
  if (dx) duck.facing = Math.sign(dx);
  if (duck.moving) walkTime += dt * (power.chili > 0 ? 1.8 : 1);
  if (power.chili > 0 && duck.moving && Math.random() < 0.6)
    particles.push({ x: duck.x - duck.facing * 18, y: duckY() + 10, vx: -duck.facing * 60, vy: -40, life: 0.3, color: '#ff8c1a', size: 4 });

  // Score
  score += dt * 10 * (power.corn > 0 ? 2 : 1);
  speedUp = 1 + score / 400;

  // Spawn hazards and food
  spawnTimer -= worldDt;
  if (spawnTimer <= 0) {
    spawnThing();
    spawnTimer = Math.max(0.22, 0.75 - score / 900);
  }
  foodTimer -= dt;
  if (foodTimer <= 0) { spawnFood(); foodTimer = 4 + Math.random() * 4; }

  // Falling hazards
  for (const t of things) {
    if (t.landed) {
      t.fuse -= worldDt;                     // TNT sitting on the ground, fuse burning
      if (t.fuse <= 0) { t.dead = true; explode(t); }
      continue;
    }
    t.y += t.vy * worldDt;
    t.wob += t.ws * worldDt;
    if (t.y + t.h / 2 >= GROUND) {
      t.y = GROUND - t.h / 2;
      if (t.type === 'tnt') { t.landed = true; t.fuse = 1.0; }
      else {
        t.dead = true;                       // smash into the ground
        const dust = t.type === 'crate' ? ['#c99a5b', '#7a5230'] : t.type === 'piano' ? ['#5a3825', '#f2f2f2', '#11152e'] : ['#8a8fa3', '#3b6bdc'];
        burst(t.x, GROUND - 4, dust, t.type === 'piano' ? 30 : 12, 180, 4);
        if (t.type === 'piano') shake = 0.25;
      }
    }
    if (!t.dead && state === 'playing' && hitsDuck(t)) {
      t.dead = true;
      if (t.type === 'tnt') explode(t); else hurt();
    }
  }
  things = things.filter(t => !t.dead);

  // Falling food
  for (const f of foods) { f.y += f.vy * worldDt; f.bob += dt * 6; }
  foods = foods.filter(f => {
    if (Math.hypot(f.x - duck.x, f.y - duckY()) < f.r + duckR()) {
      const info = FOODS[f.name];
      if (f.name === 'donut') power.shield = true; else power[f.name] = info.dur;
      score += 25;
      popup(info.label, f.x, f.y - 20, info.color);
      burst(f.x, f.y, [info.color, '#fff'], 14, 160, 4);
      return false;
    }
    return f.y < GROUND;
  });
}

// ===== Draw =====
function drawDuck(x, y, facing, frame, px) {
  const img = sprite(frame ? 'duck2' : 'duck1', px);
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(facing, 1);
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 14 * shake / 0.35, (Math.random() - 0.5) * 14 * shake / 0.35);
  ctx.clearRect(-20, -20, W + 40, H + 40);

  // Slow-mo tint
  if (state === 'playing' && power.popsicle > 0) { ctx.fillStyle = 'rgba(127,216,255,0.10)'; ctx.fillRect(0, 0, W, H); }

  // Ground
  ctx.fillStyle = '#2f6b3a'; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = '#3f8a4c'; ctx.fillRect(-20, GROUND, W + 40, 6);
  if (TOUCH) {
    // Grass tufts
    ctx.fillStyle = '#3f8a4c';
    for (let x = 12; x < W; x += 37) ctx.fillRect(x, GROUND + 22 + (x * 7 % 70), 4, 8);
  }

  if (state === 'playing' || state === 'over') {
    // Food (with a soft glow so it stands out from hazards)
    for (const f of foods) {
      const y = f.y + Math.sin(f.bob) * 3;
      ctx.fillStyle = FOODS[f.name].color + '33';
      ctx.beginPath(); ctx.arc(f.x, y, 24, 0, Math.PI * 2); ctx.fill();
      ctx.drawImage(f.img, Math.round(f.x - f.img.width / 2), Math.round(y - f.img.height / 2));
    }
    // Hazards
    for (const t of things) {
      ctx.save(); ctx.translate(t.x, t.y);
      if (!t.landed) ctx.rotate(Math.sin(t.wob) * 0.15);
      ctx.drawImage(t.img, -t.w / 2, -t.h / 2);
      if (t.landed && Math.floor(t.fuse * 12) % 2 === 0) {   // blinking fuse warning
        ctx.globalAlpha = 0.6; ctx.fillStyle = '#fff'; ctx.fillRect(-t.w / 2, -t.h / 2, t.w, t.h); ctx.globalAlpha = 1;
      }
      ctx.restore();
    }
    // Duck (blinks while invulnerable)
    if (!(duck.invuln > 0 && Math.floor(duck.invuln * 12) % 2 === 0)) {
      const frame = duck.moving && Math.floor(walkTime * 10) % 2;
      drawDuck(duck.x, duckY() + (frame ? -2 : 0), duck.facing, frame, duckPx());
    }
    if (power.shield) {
      ctx.strokeStyle = 'rgba(78,225,193,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(duck.x, duckY(), duckR() + 12 + Math.sin(performance.now() / 150) * 2, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Explosions
  for (const b of blasts) {
    const k = 1 - b.life / 0.4;
    ctx.fillStyle = `rgba(255,${180 - k * 120},60,${0.7 * (1 - k)})`;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.4 + 0.6 * k), 0, Math.PI * 2); ctx.fill();
  }
  for (const p of particles) { ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if (state === 'playing' || state === 'over') drawHud();
  if (state === 'menu') drawMenu();
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    centerText('QUACK! GAME OVER', GROUND / 2 - 30, 38, '#ff5d73');
    centerText('Score: ' + Math.floor(score), GROUND / 2 + 25, 26, '#fff');
    centerText(TOUCH ? 'Tap to try again' : 'Click, tap, or press Space to try again', GROUND / 2 + 80, 16, '#ccd');
  }
}

function drawHud() {
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'left';
  ctx.fillText(Math.floor(score), 20, 44);
  ctx.font = '16px monospace'; ctx.fillStyle = '#aab';
  ctx.fillText('Best: ' + best, 20, 68);

  // Active power-ups, top right: icon + time bar
  let y = 24;
  const active = [];
  if (power.shield) active.push(['donut', 1]);
  for (const k of ['chili', 'mushroom', 'popsicle', 'corn']) if (power[k] > 0) active.push([k, power[k] / FOODS[k].dur]);
  for (const [name, frac] of active) {
    const img = sprite(name, 3);
    ctx.drawImage(img, W - 110, y);
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(W - 80, y + 8, 60, 8);
    ctx.fillStyle = FOODS[name].color; ctx.fillRect(W - 80, y + 8, 60 * frac, 8);
    y += 34;
  }
}

function drawMenu() {
  drawDuck(W / 2, GROUND - 26, 1, Math.floor(performance.now() / 300) % 2, 4);
  centerText('DODGE!', 130, 64, '#ffd93b');
  centerText('Help the duck dodge falling junk.', 180, 17, '#ccd');
  centerText('Watch out: TNT explodes when it lands!', 205, 15, '#ff8c6b');

  // Hazard lineup
  const hz = ['bowlingBall', 'crate', 'tnt', 'piano'];
  let x = 70;
  for (const n of hz) { const img = sprite(n, 3); ctx.drawImage(img, x, 245 + (33 - img.height) / 2); x += img.width + 40; }

  centerText('Eat food for power-ups:', 325, 17, '#fff');
  let y = 350;
  for (const n of FOOD_NAMES) {
    const img = sprite(n, 3);
    ctx.drawImage(img, 105, y);
    ctx.fillStyle = FOODS[n].color; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'left';
    ctx.fillText(FOODS[n].desc, 145, y + 18);
    y += 36;
  }
  centerText(TOUCH ? 'Drag on the grass to move' : '← → or A/D to move · drag on phones', 560, 14, '#99a');
  centerText(TOUCH ? 'Tap to start' : 'Click, tap, or press Space to start', 595, 18, '#fff');
}

function centerText(t, y, size, color) {
  ctx.fillStyle = color; ctx.font = `bold ${size}px monospace`; ctx.textAlign = 'center';
  ctx.fillText(t, W / 2, y);
}

// ===== Main loop =====
function loop(t) {
  const dt = Math.min(0.033, (t - (lastTime || t)) / 1000);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
