<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wobbly: Rooftop Runner</title>
<style>
  html, body { margin: 0; height: 100%; background: #120b24; overflow: hidden; touch-action: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); pointer-events: none; }
  .grp { display: flex; gap: 12px; align-items: flex-end; }
  .tbtn { pointer-events: auto; width: 74px; height: 74px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12); color: #fff; font-size: 12px; font-weight: 700; display: flex;
    flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; touch-action: none; }
  .tbtn b { font-size: 22px; }
  .tbtn.big { width: 92px; height: 92px; }
  .tbtn.on { background: rgba(140,255,170,.35); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="grp">
    <div class="tbtn" data-k="down"><b>▼</b>Squish</div>
    <div class="tbtn" data-k="shape"><b>⟳</b>Shape</div>
    <div class="tbtn" data-k="stilt"><b>⇕</b>Stilts</div>
  </div>
  <div class="grp">
    <div class="tbtn" data-k="arms"><b>✋</b>Arms</div>
    <div class="tbtn big" data-k="jump"><b>▲</b>Jump</div>
  </div>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const H = 540;
let W = 960, scale = 1, dpr = 1, offY = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = innerWidth, vh = innerHeight;
  scale = vh / H;
  W = vw / scale;
  if (W < 640) { scale = vw / 640; W = 640; }
  if (W > 1600) W = 1600;
  offY = (vh - H * scale) / 2;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hash(a, b) {
  let n = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (c, f) => [c[0] * f, c[1] * f, c[2] * f];
const tint = (c, f) => [c[0] + (255 - c[0]) * f, c[1] + (255 - c[1]) * f, c[2] + (255 - c[2]) * f];

// ---------- audio ----------
let AC = null, muted = false;
function ensureAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    else if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(f1, f2, dur, type = 'sine', vol = 0.12) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  jump: () => tone(260, 620, 0.16, 'sine', 0.14),
  dbl: () => tone(480, 1050, 0.13, 'sine', 0.11),
  land: () => tone(170, 80, 0.1, 'triangle', 0.12),
  gummy: () => tone(950, 1500, 0.07, 'square', 0.04),
  morph: () => { tone(420, 180, 0.12, 'triangle', 0.1); setTimeout(() => tone(200, 640, 0.12, 'triangle', 0.08), 60); },
  grab: () => tone(220, 520, 0.12, 'sawtooth', 0.05),
  whiff: () => tone(500, 250, 0.1, 'sine', 0.05),
  smash: () => tone(140, 45, 0.22, 'square', 0.1),
  splat: () => { tone(260, 40, 0.45, 'sawtooth', 0.16); tone(90, 30, 0.5, 'sine', 0.2); },
  pound: () => tone(600, 120, 0.15, 'triangle', 0.08),
  star: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f * 1.01, 0.12, 'triangle', 0.08), i * 70)); },
  meow: () => { tone(700, 950, 0.12, 'sawtooth', 0.04); setTimeout(() => tone(950, 520, 0.22, 'sawtooth', 0.04), 120); },
  levelup: () => { [392, 523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, f, 0.18, 'triangle', 0.09), i * 110)); },
  growl: () => { tone(140, 90, 0.35, 'sawtooth', 0.06); },
  screech: () => { tone(1800, 1200, 0.35, 'sawtooth', 0.035); setTimeout(() => tone(1600, 900, 0.3, 'sawtooth', 0.03), 200); },
  yelp: () => { tone(900, 1400, 0.1, 'square', 0.05); setTimeout(() => tone(1000, 1600, 0.12, 'square', 0.05), 120); },
  bark: () => { tone(320, 180, 0.08, 'square', 0.05); setTimeout(() => tone(300, 160, 0.09, 'square', 0.05), 110); },
};

// ---------- shapes ----------
const SHAPES = {
  blob:   { name: 'Blob',   rx: 25, ry: 21, leg: 0, jump: 680, w: 42, col: [130, 255, 50] },
  ball:   { name: 'Ball',   rx: 17, ry: 17, leg: 0, jump: 600, w: 32, col: [235, 80, 220] },
  spring: { name: 'Spring', rx: 17, ry: 34, leg: 0, jump: 900, w: 32, col: [60, 240, 220] },
};
const FLAT = { rx: 33, ry: 9, leg: 0, w: 60 };
const ORDER = ['blob', 'ball', 'spring'];
const STILT_MAX = 215;
const POWERS = {
  buff: { name: 'BUFF', col: [255, 80, 70], dur: 10 },
  tiny: { name: 'TINY · GUMMY MAGNET', col: [80, 165, 255], dur: 10 },
  jump: { name: 'SUPER JUMP', col: [255, 210, 60], dur: 10 },
};
const powerIs = t => P.power && P.power.type === t;
const pScale = () => powerIs('buff') ? 1.3 : powerIs('tiny') ? 0.5 : 1;
const G = 2000;

// ---------- jelly wobble ----------
const N = 40;
const off = new Float32Array(N), ov = new Float32Array(N);
const cosT = [], sinT = [];
for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2; cosT.push(Math.cos(a)); sinT.push(Math.sin(a)); }
function wobble(dt) {
  for (let i = 0; i < N; i++) {
    const l = off[(i + N - 1) % N], r = off[(i + 1) % N];
    ov[i] += (-260 * off[i] - 7 * ov[i] + 90 * (l + r - 2 * off[i])) * dt;
  }
  for (let i = 0; i < N; i++) off[i] = clamp(off[i] + ov[i] * dt, -13, 13);
}
function impulse(kind, amt) {
  for (let i = 0; i < N; i++) {
    const c = Math.abs(cosT[i]), s = sinT[i];
    if (kind === 'land') ov[i] += amt * (c * 1.1 - Math.max(0, s) * 1.3 - Math.max(0, -s) * 0.5);
    else if (kind === 'jump') ov[i] += amt * (-c * 0.7 + Math.abs(s) * 0.9);
    else ov[i] += (Math.random() - 0.5) * amt * 2;
  }
}

// ---------- state ----------
let state = 'title', time = 0, camX = 0;
let trail = [], trailT = 0, powerups = [], shake = 0, level = 1, levelBanner = 0;
const isAnimal = o => o.t === 'dog' || o.t === 'cat' || o.t === 'armadillo' || o.t === 'bobcat' || o.t === 'eagle' || !!NEW_ANIMALS[o.t];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
let P, vis, buildings, obstacles, hooks, gummies, parts, stats, nearHook, deathMsg, deadT;
let best = 0;
try { best = +localStorage.getItem('wobbly-best') || 0; } catch (e) {}
const keys = { jump: false, down: false, arms: false, stilt: false };

function reset() {
  P = { x: 0, y: 380, vy: 0, prevY: 380, ground: true, coyote: 0, air: 0, shape: 'blob', flat: false,
        grap: null, bonus: 0, phase: 0, spin: 0, reach: 0, pound: false, leg: 0, power: null };
  vis = { rx: 25, ry: 21, leg: 0, col: SHAPES.blob.col.slice(), scale: 1 };
  powerups = []; shake = 0; level = 1; levelBanner = 0; thFrom = thTo = 0; thT = 1;
  buildings = [{ x: -500, w: 1700, top: 380, seed: 7, col: 0 }];
  obstacles = []; hooks = []; gummies = []; parts = []; trail = []; trailT = 0;
  stats = { gummies: 0, swings: 0, smashes: 0 };
  nearHook = null; deathMsg = ''; deadT = 0;
  off.fill(0); ov.fill(0);
  camX = P.x - W * 0.28;
  while (buildings[buildings.length - 1].x < camX + W + 900) addBuilding();
}

const baseSpeed = () => 375 + Math.min(430, Math.max(0, P.x) * 0.009);
const curSpeed = () => baseSpeed() * (P.shape === 'ball' && !P.flat ? 1.15 : 1);
const meters = () => Math.max(0, Math.floor(P.x / 30));
const score = () => meters() + stats.gummies * 10 + stats.swings * 25 + stats.smashes * 15 + (stats.stars || 0) * 20;

function hitbox() {
  const k = pScale();
  if (P.flat) return { w: FLAT.w * k, h: FLAT.ry * 2 * k };
  const s = SHAPES[P.shape];
  return { w: s.w * k, h: (s.ry * 2 + s.leg) * k };
}

// ---------- level generation ----------
function addBuilding() {
  const prev = buildings[buildings.length - 1];
  const diff = clamp(prev.x / 40000, 0, 1);
  const early = buildings.length <= 2;
  // gap types: plain jump, medium gap with a bonus hook, big single-hook gap, or a multi-hook swing chain
  const r = Math.random();
  let kind = 'jump';
  if (!early) {
    if (prev.x > 2500 && r < 0.14 + diff * 0.06) kind = 'chain';
    else if (r < 0.36) kind = 'big';
    else if (r < 0.52) kind = 'mid';
  }
  let nh = 0, gap;
  if (kind === 'chain') { nh = 2 + (Math.random() < 0.35 + diff * 0.5 ? 1 : 0); gap = 260 * (nh + 1) + rnd(-20, 30); }
  else if (kind === 'big') { nh = 1; gap = rnd(430, 530); }
  else if (kind === 'mid') { nh = 1; gap = rnd(240, 320); }
  else gap = rnd(70, 140 + diff * 110);
  let top = nh ? prev.top + rnd(-40, 40) : prev.top + rnd(-80, 70);
  top = clamp(top, 270, 440);
  const w = rnd(440, 950 - diff * 250);
  const b = { x: prev.x + prev.w + gap, w, top, seed: (Math.random() * 1e9) | 0, col: (Math.random() * 4) | 0 };
  buildings.push(b);

  const baseY = Math.min(prev.top, top);
  for (let i = 0; i < nh; i++) {
    const hx = prev.x + prev.w + gap * (i + 1) / (nh + 1);
    const hy = baseY - rnd(150, 178) - (nh > 1 ? (i % 2) * 18 : 0) - (kind === 'mid' ? 20 : 0);
    hooks.push({ x: hx, y: hy });
    for (let j = -3; j <= 3; j++) {
      if (nh > 1 && Math.abs(j) === 3) continue;
      const a = j * 0.3;
      gummies.push({ x: hx + Math.sin(a) * 150, y: hy + Math.cos(a) * 150 + 4, got: false });
    }
  }

  const sp = 375 + Math.min(430, b.x * 0.009);
  let x = b.x + rnd(160, 260);
  const end = b.x + w - 130;
  while (x < end) {
    if (Math.random() < (level > 1 ? Math.min(0.99, 0.96 + 0.004 * level) : 0.86)) {
      const o = placeObstacle(b, x, diff, end);
      if (o) x += o.w + (o.vx ? 120 : 0);
    } else {
      const n = 4 + ((Math.random() * 3) | 0);
      const hgt = rnd(40, 90);
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        gummies.push({ x: x + i * 34, y: b.top - 30 - Math.sin(t * Math.PI) * hgt, got: false });
      }
      x += n * 34;
    }
    x += (200 + sp * 0.4 + rnd(0, 170)) * (level > 1 ? Math.max(0.48, 0.68 - 0.022 * level) : 1);
  }
  if (level > 1) {
    const n = 1 + (Math.random() < 0.5 + diff * 0.5 ? 1 : 0) + (Math.random() < diff ? 1 : 0) + Math.floor((level - 2) / 3);
    const kinds = ['dog', 'cat', 'bobcat', 'armadillo', 'eagle', 'eagle'];
    for (const k in NEW_ANIMALS) if (NEW_ANIMALS[k].lv <= level) kinds.push(k, k, ...(NEW_ANIMALS[k].lv === level ? [k, k] : []));
    for (let i = 0; i < n; i++) {
      const ax = b.x + rnd(150, Math.max(160, w - 520));
      if (obstacles.some(o => (o.t === 'sign' || o.t === 'duct') && Math.abs(o.x - (ax + 250)) < 200)) continue;
      placeObstacle(b, ax, diff, b.x + w - 20, kinds[(Math.random() * kinds.length) | 0]);
    }
  }
  if (b.x > 1200 && Math.random() < (level > 1 ? Math.max(0.06, 0.12 - 0.007 * (level - 2)) : 0.32)) {
    for (let tries = 0; tries < 8; tries++) {
      const px = b.x + rnd(90, w - 140);
      if (obstacles.some(o => o.x < px + 90 && o.x + o.w > px - 90 && !o.vx)) continue;
      const r = Math.random() * 2.3, type = r < 0.3 ? 'buff' : r < 1.3 ? 'tiny' : 'jump';   // buff is ~1 in 8
      powerups.push({ x: px, y: b.top - (type === 'buff' || Math.random() < 0.4 ? 110 : 32), type, ph: Math.random() * 6 });
      break;
    }
  }
}

// ---------- the level-3+ animal roster (one new animal per level) ----------
const NEW_ANIMALS = {
  raccoon:  { lv: 3,  w: 40, h: 26, v: -230, body: [118, 118, 126], belly: [190, 190, 196], ear: 'round', tail: 'ring', pattern: 'mask', eye: [20, 20, 20],
              cry: () => tone(1300, 1700, 0.08, 'square', 0.035), msg: 'Mugged by a raccoon! (Jump over it)' },
  goat:     { lv: 4,  w: 48, h: 38, v: -270, body: [236, 232, 222], belly: [210, 204, 190], ear: 'horn', tail: 'short', pattern: 'beard', eye: [120, 80, 20],
              cry: () => { tone(420, 380, 0.4, 'sawtooth', 0.04); }, msg: 'Head-butted by a goat! (Jump or stilt over it)' },
  snake:    { lv: 5,  w: 62, h: 12, v: -170, body: [70, 150, 60], belly: [200, 210, 120], special: 'snake',
              cry: () => tone(3000, 2600, 0.3, 'sawtooth', 0.015), msg: 'Bitten by a snake! (Hop over it)' },
  penguin:  { lv: 6,  w: 34, h: 18, v: -330, body: [25, 28, 36], belly: [240, 240, 245], special: 'penguin',
              cry: () => tone(800, 500, 0.15, 'square', 0.04), msg: 'Bowled over by a belly-sliding penguin! (Jump over it)' },
  owl:      { lv: 7,  w: 40, h: 22, v: -230, body: [120, 90, 60], belly: [215, 190, 150], fly: true, special: 'owl',
              cry: () => { tone(320, 300, 0.25, 'sine', 0.08); setTimeout(() => tone(300, 280, 0.35, 'sine', 0.08), 300); }, msg: 'Swooped by an owl! (Squish flat as it dives)' },
  robodog:  { lv: 8,  w: 50, h: 34, v: -290, body: [150, 156, 170], belly: [100, 106, 120], ear: 'antenna', tail: 'short', pattern: 'metal', eye: [255, 50, 50],
              cry: () => { tone(900, 900, 0.06, 'square', 0.04); setTimeout(() => tone(600, 600, 0.06, 'square', 0.04), 90); }, msg: 'Zapped by a robo-dog! (Jump or stilt over it)' },
  bats:     { lv: 9,  w: 40, h: 18, v: -280, body: [40, 30, 45], fly: true, special: 'bats',
              cry: () => tone(2400, 2800, 0.06, 'square', 0.025), msg: 'Swarmed by bats! (Squish flat as they swoop)' },
  gorilla:  { lv: 10, w: 66, h: 72, v: -160, body: [44, 40, 46], belly: [80, 72, 76], ear: 'round', tail: 'none', pattern: 'ape', eye: [60, 30, 10],
              cry: () => { tone(110, 70, 0.5, 'sawtooth', 0.08); }, msg: 'Flattened by a gorilla! (Use your stilt legs!)' },
};
function makeNewAnimal(t, x, T) {
  const a = NEW_ANIMALS[t];
  const o = { t, x: x + 260, w: a.w, h: a.h, solid: false, vx: a.v, minX: -1e9, jy: 0, jvy: 0, run: Math.random() * 6 };
  if (a.fly) { o.fly = true; o.baseY = T; o.y = T - 220; o.x += 120; }
  else { o.baseY = T - a.h; o.y = T - a.h; }
  return o;
}
function drawNewAnimal(o, x) {
  const a = NEW_ANIMALS[o.t], ph = o.run;
  if (o.flee) { ctx.save(); ctx.translate(x + o.w / 2, 0); ctx.scale(-1, 1); ctx.translate(-(x + o.w / 2), 0); }
  const w = o.w, h = o.h, y = o.y;
  if (a.special === 'snake') {
    ctx.strokeStyle = rgb(a.body); ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) { const xx = x + 6 + i * (w - 10) / 12, yy = y + 7 + Math.sin(ph * 0.8 + i * 0.9) * 3.5; i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
    ctx.stroke();
    ctx.strokeStyle = rgb(a.belly, 0.6); ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = rgb(shade(a.body, 0.85)); ctx.beginPath(); ctx.ellipse(x + 4, y + 7 + Math.sin(ph * 0.8) * 3.5, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe14a'; ctx.beginPath(); ctx.arc(x + 2, y + 5 + Math.sin(ph * 0.8) * 3.5, 1.4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e0303a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 2, y + 8); ctx.lineTo(x - 8, y + 8 + Math.sin(ph * 3) * 2); ctx.stroke();
  } else if (a.special === 'penguin') {
    ctx.fillStyle = rgb(a.body); ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2 + 1, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(a.belly); ctx.beginPath(); ctx.ellipse(x + w / 2 + 2, y + h / 2 + 4, w / 2 - 4, h / 2 - 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = rgb(a.body); ctx.beginPath(); ctx.arc(x + 4, y + h / 2 - 1, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 2, y + h / 2 - 3, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 1.6, y + h / 2 - 3, 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f39c22'; ctx.beginPath(); ctx.moveTo(x - 2, y + h / 2 - 2); ctx.lineTo(x - 8, y + h / 2); ctx.lineTo(x - 2, y + h / 2 + 1); ctx.fill();
    ctx.fillRect(x + w - 6, y + h - 6, 8, 3);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    for (let i = 0; i < 3; i++) ctx.fillRect(x + w + 4 + i * 8 + (ph * 3 % 8), y + h - 2 - i, 4, 1.5);   // ice spray
  } else if (a.special === 'owl' || a.special === 'bats') {
    const n = a.special === 'bats' ? 3 : 1;
    for (let k = 0; k < n; k++) {
      const bx = x + w / 2 + (n > 1 ? (k - 1) * 13 : 0), by = y + h / 2 + (n > 1 ? Math.sin(ph + k * 2) * 4 : 0), fl = Math.sin(ph * (n > 1 ? 1.8 : 1) + k);
      const s = n > 1 ? 0.55 : 1;
      ctx.fillStyle = rgb(shade(a.body, 0.85));
      for (const kk of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx + 8 * s, by - 18 * fl * s - 4 * kk * s, bx + 22 * s, by - 16 * fl * s + kk * 4 * s);
        if (n > 1) { ctx.lineTo(bx + 16 * s, by - 6 * fl * s); ctx.lineTo(bx + 12 * s, by - 9 * fl * s); }
        ctx.lineTo(bx + 10 * s, by + 3 * s); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = rgb(a.body); ctx.beginPath(); ctx.ellipse(bx, by, 11 * s, 9 * s, 0, 0, Math.PI * 2); ctx.fill();
      if (a.belly) { ctx.fillStyle = rgb(a.belly); ctx.beginPath(); ctx.ellipse(bx - 2 * s, by + 2 * s, 6 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill(); }
      const ey = by - 3 * s;
      if (n === 1) {
        for (const ex of [bx - 7, bx - 1]) {
          ctx.fillStyle = '#ffd23a'; ctx.beginPath(); ctx.arc(ex, ey, 3.2, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex - 0.5, ey, 1.6, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#e0a030'; ctx.beginPath(); ctx.moveTo(bx - 5, ey + 2); ctx.lineTo(bx - 3, ey + 6); ctx.lineTo(bx - 1, ey + 2); ctx.fill();
        ctx.fillStyle = rgb(a.body);
        ctx.beginPath(); ctx.moveTo(bx - 10, ey - 3); ctx.lineTo(bx - 9, ey - 10); ctx.lineTo(bx - 5, ey - 5); ctx.fill();
        ctx.beginPath(); ctx.moveTo(bx + 2, ey - 5); ctx.lineTo(bx + 5, ey - 10); ctx.lineTo(bx + 5, ey - 3); ctx.fill();
      } else {
        ctx.fillStyle = '#ff5050'; ctx.fillRect(bx - 5 * s, ey, 1.5, 1.5); ctx.fillRect(bx - 2 * s, ey, 1.5, 1.5);
        ctx.fillStyle = rgb(a.body);
        ctx.beginPath(); ctx.moveTo(bx - 6 * s, ey - 3); ctx.lineTo(bx - 5 * s, ey - 9 * s); ctx.lineTo(bx - 2 * s, ey - 4); ctx.fill();
      }
    }
  } else {
    // generic four-legged runner

function drawWeather(th, alpha) {

function drawBG() {

    if (lights) {

    fcx = cx + Math.sin(P.phase * 0.9) * 1.2;
    fcy = cy - ry * yt + ry * 0.22 - fry * 0.62;
    ctx.fillStyle = rgb(col, 0.8);              // gooey neck
    ctx.beginPath(); ctx.ellipse(cx, cy - ry * yt + ry * 0.12, frx * 0.55, ry * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    pts = drawBody(fcx, fcy, frx, fry, 0.62, 1.3, 0, false);
  } else pts = drawBody(cx, cy, rx, ry, yb, yt, bf, true);

  {
  const cx = fcx, cy = fcy, rx = frx, ry = fry, yt = fyt, bf = fbf, sc = fsc;
  // face: mismatched, half-sunk eyeballs and a crooked gap
  const er = Math.max(2.2, Math.min(6.5 * sc, ry * 0.45)) * lerp(1, 0.62, bf);
  const ey = cy - ry * (P.flat ? 0.05 : lerp(0.3, 0.62, bf));
  let lx = 2, ly = 0;
  if (P.grap) { lx = 1; ly = -2; } else if (!P.ground) ly = P.vy < 0 ? -1.5 : 1.5;
  const sizes = scared ? [1.15, 1.35] : [0.72, 1.05];
  const blink = !scared && (time % 4.1) < 0.12;
  if (scared) { lx = 2.2; ly = 0; }
  [-1, 1].forEach((k, idx) => {
    const r = er * sizes[idx];
    const ex = cx + rx * 0.15 + k * rx * 0.36, eyy = ey + (idx || scared ? 0 : r * 0.45) + Math.sin(time * 2 + idx) * 0.6;
    ctx.fillStyle = scared ? '#f4f1d8' : '#e9e3a8';
    ctx.beginPath(); ctx.ellipse(ex, eyy, r, r * (P.flat ? 0.65 : 1), 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'rgba(190,40,40,0.65)'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(ex - r, eyy + r * 0.1); ctx.lineTo(ex - r * 0.35, eyy - r * 0.05);
    ctx.moveTo(ex + r * 0.9, eyy + r * 0.4); ctx.lineTo(ex + r * 0.3, eyy + r * 0.15); ctx.stroke();
    ctx.fillStyle = '#120d05';
    const pr = scared ? r * 0.17 : r * (idx ? 0.36 : 0.3);
    ctx.beginPath(); ctx.arc(ex + lx * r * 0.28, eyy + ly * r * 0.2, pr, 0, 6.28); ctx.fill();
    if (scared) {
      // eyebrows shoot up
      ctx.strokeStyle = rgb(shade(col, 0.4), 0.9); ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - r * 0.8, eyy - r * 1.25 - k * r * 0.25); ctx.lineTo(ex + r * 0.8, eyy - r * 1.25 + k * r * 0.25); ctx.stroke();
    } else if (powerIs('buff')) {
      ctx.strokeStyle = rgb(shade(col, 0.35), 0.95); ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - r * 1.1, eyy - r * 1.2 + k * r * 0.45); ctx.lineTo(ex + r * 1.1, eyy - r * 1.2 - k * r * 0.45); ctx.stroke();
    } else if (smug) {
      ctx.fillStyle = rgb(col, 0.9);
      ctx.beginPath(); ctx.ellipse(ex, eyy - r * 0.45, r * 1.08, r * 0.65, 0, 0, 6.28); ctx.fill();
    } else {
      // slime film over the eye (and droopy lid when blinking)
      ctx.fillStyle = rgb(col, blink ? 0.95 : 0.4);
      ctx.beginPath(); ctx.ellipse(ex, eyy - (blink ? 0 : r * 0.55), r * 1.05, blink ? r * 1.05 : r * 0.5, 0, 0, 6.28); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,240,0.8)';
    ctx.beginPath(); ctx.arc(ex - r * 0.35, eyy - r * 0.3, r * 0.16, 0, 6.28); ctx.fill();
  });
  // mouth
  const mx = cx + rx * 0.2, my = cy + ry * (P.flat ? 0.3 : lerp(0.25, -0.3, bf));
  ctx.fillStyle = '#1e1405';
  if (scared) {
    // wobbly screaming O and a bead of sweat
    const mw = er * 0.55 + Math.sin(time * 40) * 0.4, mh = er * 0.85 + Math.sin(time * 33) * 0.5;
    ctx.beginPath(); ctx.ellipse(mx, my + er * 0.2, mw, mh, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#7a2a2a'; ctx.beginPath(); ctx.ellipse(mx, my + er * 0.2 + mh * 0.5, mw * 0.6, mh * 0.35, 0, 0, 6.28); ctx.fill();
    const sx = cx - rx * 0.55, sy = cy - ry * 0.6 + ((time * 1.5) % 1) * ry * 0.6;
    ctx.fillStyle = 'rgba(200,235,255,0.85)';
    ctx.beginPath(); ctx.moveTo(sx, sy - 5); ctx.quadraticCurveTo(sx + 3.5, sy + 1, sx, sy + 3); ctx.quadraticCurveTo(sx - 3.5, sy + 1, sx, sy - 5); ctx.fill();
  } else if (smug) {
    ctx.strokeStyle = '#1e1405'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(mx - er * 0.8, my); ctx.quadraticCurveTo(mx, my + er * 0.7, mx + er * 0.9, my - er * 0.3); ctx.stroke();
  } else {
    const open = (!P.ground && !P.grap && P.vy > 200) || P.flat ? 1 : 0.45 + 0.15 * Math.sin(time * 5);
    ctx.beginPath();
    ctx.moveTo(mx - er * 0.9, my - er * 0.1);
    ctx.quadraticCurveTo(mx - er * 0.2, my + er * 0.9 * open, mx + er * 0.8, my + er * 0.15);
    ctx.quadraticCurveTo(mx, my + er * 0.1, mx - er * 0.9, my - er * 0.1);
    ctx.fill();
    ctx.fillStyle = '#d9d2a0'; ctx.fillRect(mx - er * 0.15, my + er * 0.02, er * 0.28, er * 0.32); // one snaggle tooth
  }
  drawSheen(pts, cx, cy, rx, ry, yt, col);
  }
}

function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    ctx.fillStyle = rgb(p.col, 0.9);
    const x = p.x - camX;
    if (p.sq) ctx.fillRect(x - p.size / 2, p.y - p.size / 2, p.size, p.size * 0.6);
    else {
      const sp = Math.hypot(p.vx, p.vy), st = 1 + Math.min(1.5, sp / 400);
      ctx.beginPath(); ctx.ellipse(x, p.y, p.size * st, p.size / Math.sqrt(st), Math.atan2(p.vy, p.vx), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawHUD() {
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(20,10,40,0.55)'; roundRect(14, 14, 236, 62, 14); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.font = 'bold 24px system-ui, sans-serif'; ctx.fillText(`${meters()} m`, 28, 36);
  ctx.font = '13px system-ui, sans-serif'; ctx.fillStyle = '#ffcf7a';
  ctx.fillText(`● ${stats.gummies}   score ${score()}`, 28, 60);
  if (P.power) {
    const pw = POWERS[P.power.type], f = clamp(P.power.t / P.power.max, 0, 1);
    ctx.fillStyle = 'rgba(20,10,40,0.55)'; roundRect(14, 84, 190, 30, 12); ctx.fill();
    ctx.fillStyle = rgb(pw.col, 0.25); roundRect(20, 100, 178, 8, 4); ctx.fill();
    ctx.fillStyle = rgb(pw.col); roundRect(20, 100, Math.max(8, 178 * f), 8, 4); ctx.fill();
    ctx.fillStyle = rgb(pw.col); ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`★ ${pw.name}`, 22, 92); ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`${Math.ceil(P.power.t)}s`, 198, 92);
  }
  ctx.fillStyle = level > 1 ? rgb(tint(THEMES[level - 1].capLine, 0.2)) : 'rgba(255,255,255,0.5)'; ctx.textAlign = 'right';
  ctx.font = 'bold 11px system-ui, sans-serif'; ctx.fillText(`LEVEL ${level}`, 238, 60); ctx.font = '13px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(`best ${best}`, 238, 36);

  // shape chips
  const bx = W - 14 - ORDER.length * 82;
  for (let i = 0; i < ORDER.length; i++) {
    const s = SHAPES[ORDER[i]], on = ORDER[i] === P.shape, x = bx + i * 82;
    ctx.fillStyle = on ? rgb(s.col, 0.9) : 'rgba(20,10,40,0.55)';
    roundRect(x, 14, 74, 34, 12); ctx.fill();
    ctx.fillStyle = on ? '#1a1030' : rgb(s.col);
    ctx.textAlign = 'center'; ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.fillText(isTouch ? s.name : `${i + 1} ${s.name}`, x + 37, 31);
  }
}

function centerText(t, y, size, col, weight = 'bold') {
  ctx.font = `${weight} ${size}px system-ui, sans-serif`; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, W / 2, y);
}

function drawOverlay() {
  if (state === 'title') {
    ctx.fillStyle = 'rgba(15,8,35,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.shadowColor = '#78ff9a'; ctx.shadowBlur = 24;
    centerText('WOBBLY', 92, 76, '#8dffa8', '900');
    ctx.shadowBlur = 0;
    centerText('ROOFTOP RUNNER', 140, 20, '#ffd59a');
    const rows = isTouch ? [
      ['▲ Jump', 'tap again in the air to double-jump'],
      ['▼ Squish', 'hold to flatten under signs · in the air = ground pound'],
      ['✋ Arms', 'stretch your arms to grab yellow hooks and swing'],
      ['⟳ Shape', 'Blob → Ball (fast, smashes crates) → Spring (huge jumps)'],
      ['⇕ Stilts', 'hold to grow tall legs and stride over smokestacks'],
      ['★ Stars', 'red = Buff · blue = Tiny (gummy magnet) · yellow = Super Jump'],
    ] : [
      ['Space / W / ↑', 'jump — press again in the air to double-jump'],
      ['S / ↓', 'hold to squish under signs · in the air = ground pound'],
      ['X / K', 'stretch arms to grab yellow hooks and swing (hold to swing)'],
      ['1 2 3 / Q', 'Blob · Ball (fast, smashes crates) · Spring (huge jumps)'],
      ['C / Shift', 'hold to grow tall stilt legs and stride over smokestacks'],
      ['★ Stars', 'red = Buff (smash stuff) · blue = Tiny (gummy magnet) · yellow = Super Jump'],
    ];
    ctx.font = '15px system-ui, sans-serif';
    rows.forEach((r, i) => {
      const y = 186 + i * 28;
      ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui, sans-serif'; ctx.fillText(r[0], W / 2 - 110, y);
      ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '15px system-ui, sans-serif'; ctx.fillText(r[1], W / 2 - 92, y);
    });
    const pulse = 0.6 + 0.4 * Math.sin(time * 4);
    centerText('Reach 10,000 points to beat all 10 levels', 352, 14, 'rgba(255,255,255,0.75)', 'normal');
    centerText(isTouch ? 'Tap Jump to start' : 'Press Space to start', 384, 22, `rgba(255,213,74,${pulse})`);
    if (best) centerText(`Best: ${best}`, 412, 14, 'rgba(255,255,255,0.6)', 'normal');
  } else if (state === 'won') {
    ctx.fillStyle = `rgba(10,5,25,${Math.min(0.55, deadT)})`; ctx.fillRect(0, 0, W, H);
    ctx.shadowColor = '#8dffa8'; ctx.shadowBlur = 26;
    centerText('YOU BEAT THE GAME!', 120, 52, '#8dffa8', '900');
    ctx.shadowBlur = 0;
    centerText('Wobbly conquered all 10 levels of rooftops', 170, 18, '#fff', 'normal');
    centerText(`${meters()} m   ·   ${stats.gummies} gummies   ·   ${stats.swings} swings   ·   ${stats.smashes} smashes   ·   ${stats.stars || 0} stars`, 210, 15, 'rgba(255,255,255,0.8)', 'normal');
    centerText(`Final score ${score().toLocaleString()}`, 255, 32, '#ffd54a');
    if (deadT > 1.5) centerText(isTouch ? 'Tap Jump to play again' : 'Press Space to play again', 320, 20, `rgba(141,255,168,${0.6 + 0.4 * Math.sin(time * 4)})`);
  } else if (state === 'dead' && deadT > 0.4) {
    ctx.fillStyle = `rgba(15,8,35,${Math.min(0.65, (deadT - 0.4) * 2)})`; ctx.fillRect(0, 0, W, H);
    centerText('SPLAT!', 150, 72, '#ff7ab0', '900');
    centerText(deathMsg, 205, 18, '#fff', 'normal');
    centerText(`${meters()} m   ·   ${stats.gummies} gummies   ·   ${stats.swings} swings   ·   ${stats.smashes} smashes`, 245, 15, 'rgba(255,255,255,0.7)', 'normal');
    centerText(`Score ${score()}`, 290, 30, '#ffd54a');
    centerText(score() >= best ? 'New best!' : `Best ${best}`, 325, 15, 'rgba(255,255,255,0.7)', 'normal');
    if (deadT > 0.8) centerText(isTouch ? 'Tap Jump to try again' : 'Press Space to try again', 380, 20, `rgba(141,255,168,${0.6 + 0.4 * Math.sin(time * 4)})`);
  } else if (state === 'pause') {
    ctx.fillStyle = 'rgba(15,8,35,0.55)'; ctx.fillRect(0, 0, W, H);
    centerText('PAUSED', H / 2 - 10, 48, '#fff', '900');
    centerText('P to resume', H / 2 + 34, 16, 'rgba(255,255,255,0.7)', 'normal');
  }
  if (muted) { ctx.textAlign = 'left'; ctx.font = '12px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText('muted (M)', 16, H - 14); }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#120b24'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = shake > 0 ? shake * 14 : 0;
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, (Math.random() - 0.5) * sh * dpr, offY * dpr + (Math.random() - 0.5) * sh * dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  drawBG();
  for (const h of hooks) drawHook(h);
  for (const b of buildings) drawBuilding(b);
  drawAlleyFog();
  for (const o of obstacles) drawObstacle(o);
  for (const g of gummies) if (!g.got) drawGummy(g);
  for (const pu of powerups) drawStar(pu);
  drawTrail();
  drawPlayer();
  drawParts();
  drawWeather(THEMES[thFrom], thFrom === thTo ? 1 : 1 - thT);
  if (thFrom !== thTo) drawWeather(THEMES[thTo], thT);
  if (state !== 'title') drawHUD();
  if (levelBanner > 0 && state === 'play') {
    const a = Math.min(1, levelBanner, (3.2 - levelBanner) * 3);
    ctx.globalAlpha = a;
    ctx.shadowColor = '#78dcff'; ctx.shadowBlur = 20;
    centerText(`LEVEL ${level}`, 150, 64, rgb(tint(THEMES[level - 1].capLine, 0.4)), '900');
    ctx.shadowBlur = 0;
    const na = Object.keys(NEW_ANIMALS).find(k => NEW_ANIMALS[k].lv === level);
    const extra = level === 2 ? 'cats, bobcats & eagles' : na ? `new: ${na === 'robodog' ? 'robo-dogs' : na === 'bats' ? 'bats' : na + 's'}` : '';
    centerText(`${THEMES[level - 1].name} · ${extra} · harder!`, 200, 18, '#ffffff', 'normal');
    centerText(level < 10 ? `Next level at ${(level * 1000).toLocaleString()} · win at 10,000` : 'Final level! Reach 10,000 to win', 228, 13, 'rgba(255,255,255,0.7)', 'normal');
    ctx.globalAlpha = 1;
  }
  drawOverlay();
  ctx.restore();
}

// ---------- input ----------
const isTouch = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
function start() {
  if (state === 'dead' && deadT < 0.8) return;
  if (state === 'won' && deadT < 1.5) return;
  reset(); state = 'play';
}
function press(k) {
  ensureAudio();
  if (state === 'title' || state === 'dead' || state === 'won') { if (k === 'jump') start(); return; }
  if (state === 'pause') return;
  if (k === 'jump' && !keys.jump) { keys.jump = true; doJump(); }
  else if (k === 'down' && !keys.down) {
    keys.down = true;
    if (P.ground) { if (P.leg === 0) P.flat = true; }
    else if (!P.grap) { P.vy = 1300; P.pound = true; sfx.whiff(); }
  }
  else if (k === 'arms' && !keys.arms) { keys.arms = true; grab(); }
  else if (k === 'stilt' && !keys.stilt) { keys.stilt = true; if (P.ground) sfx.grab(); }
  else if (k === 'shape') cycleShape(1);
}
function unpress(k) {
  if (k === 'jump') { keys.jump = false; if (state === 'play' && !P.grap && P.vy < -250) P.vy *= 0.55; }
  else if (k === 'down') keys.down = false;
  else if (k === 'arms') keys.arms = false;
  else if (k === 'stilt') keys.stilt = false;
}
const KEYMAP = { KeyC: 'stilt', KeyL: 'stilt', ShiftLeft: 'stilt', ShiftRight: 'stilt', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', ArrowDown: 'down', KeyS: 'down', KeyX: 'arms', KeyK: 'arms', KeyJ: 'arms' };
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (KEYMAP[e.code]) press(KEYMAP[e.code]);
  else if (e.code === 'Enter') press('jump');
  else if (state === 'play' && (e.code === 'KeyQ' || e.code === 'KeyE')) cycleShape(e.code === 'KeyQ' ? 1 : -1);
  else if (state === 'play' && /^Digit[123]$/.test(e.code)) setShape(ORDER[+e.code.slice(5) - 1]);
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
  else if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) unpress(KEYMAP[e.code]); });
addEventListener('blur', () => { keys.jump = keys.down = keys.arms = keys.stilt = false; if (state === 'play') state = 'pause'; });

if (isTouch) {
  document.getElementById('touch').style.display = 'flex';
  document.querySelectorAll('.tbtn').forEach(btn => {
    const k = btn.dataset.k;
    btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('on'); press(k); });
    const up = e => { btn.classList.remove('on'); unpress(k); };
    btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('pointerleave', up);
  });
}
cv.addEventListener('pointerdown', () => {
  ensureAudio();
  if (state === 'title' || state === 'dead' || state === 'won') start();
  else if (state === 'pause') state = 'play';
});

// ---------- loop ----------
reset();
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
